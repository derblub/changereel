<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 40px; color: #18181b; } button { font: inherit; padding: 8px 16px; }</style>
</head>
<body>
<h1>Sign in</h1>
<form id="login">
  <p><label for="email">Email</label> <input id="email" type="email"></p>
  <p><label for="password">Password</label> <input id="password" type="password"></p>
  <button>Sign in</button>
</form>
<p id="said"></p>
<script src="/visit.js"></script>
<script>
  // Every other visit of the server the login fails, and a context that failed once stays
  // locked out: only a fresh one gets through
  login.addEventListener("submit", (event) => {
    event.preventDefault();
    if (visit % 2 === 1 || document.cookie.includes("locked=1")) {
      document.cookie = "locked=1; path=/";
      said.textContent = "Try again later.";
      return;
    }
    document.cookie = "session=1; path=/";
    location.href = "/account";
  });
</script>
</body>
</html>
