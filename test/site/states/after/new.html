<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New</title>
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 40px; color: #18181b; } button { font: inherit; padding: 8px 16px; }</style>
</head>
<body>
<h1>New report</h1>
<p>A report of last month.</p>
<button id="export">Export</button>
<div id="panel" role="region" aria-label="Export" hidden><p>Export as PDF or CSV.</p></div>
<script>
  document.getElementById("export").addEventListener("click", () => (panel.hidden = false));
</script>
</body>
</html>
