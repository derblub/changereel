version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # react and react-dom must stay on the same version: a split bump fails the render (React error #527).
      react:
        patterns: ["react", "react-dom"]
