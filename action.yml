name: changereel
author: Daniel Kurdoghlian, Pushing Pixels
description: Find what a pull request changed on the pages of your site and show it as a before and after video.
branding:
  icon: film
  color: green

inputs:
  serve:
    description: "Command that serves one version of the site; {port} is replaced by the port to listen on, e.g. 'npm run preview -- --port {port}'."
    required: true
  build:
    description: "Command that builds one version, run in each of the two checkouts, e.g. 'npm ci && npm run build'. Empty builds nothing."
    default: ""
  base:
    description: "Commit, branch or tag to compare with. Default: the base of the pull request."
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: "Commit to show as the version after the change. Default: what is checked out."
    default: HEAD
  routes:
    description: "Paths to compare, separated by spaces or one per line. Empty reads them from the sitemaps of both versions."
    default: ""
  ignore:
    description: "CSS selectors, separated by commas, of parts to leave out of the comparison: what is random or animated."
    default: ""
  title:
    description: "Title on the first card of the video."
    default: ${{ github.event.pull_request.title || 'What changed' }}
  video:
    description: "'false' only compares and writes the summary and the report."
    default: "true"
  passes:
    description: "How often each page is captured. What differs between visits of the same version is left out."
    default: "2"
  max-scenes:
    description: "Scenes in the video."
    default: "8"
  ready-timeout:
    description: "Seconds to wait for a served version to answer."
    default: "120"
  narrate:
    description: "Model that says in one sentence what each change is, e.g. 'claude-opus-5-5'. Excerpts of the pages are sent to Anthropic. Empty leaves the sentences out."
    default: ""
  anthropic-api-key:
    description: "Key for the model in 'narrate'. Pass it from a secret."
    default: ""
  voice:
    description: "Piper voice that speaks the sentences, e.g. 'en_US-lessac-medium'. Empty shows them as captions only."
    default: ""
  language:
    description: "Language of the sentences and of the words in the video: 'en' or 'de'."
    default: en
  upload:
    description: "'false' leaves the video on the runner. Otherwise it is kept as an artifact of the run."
    default: "true"
  artifact-name:
    description: "Name of that artifact. Each use of the action in one run needs its own."
    default: changereel
  preview:
    description: "'false' leaves the moving picture out of the comment. Otherwise it is kept on the branch 'changereel-previews' and shown in the comment; that needs 'contents: write' and a public repository."
    default: "true"
  comment:
    description: "'false' writes no comment. Otherwise a pull request gets one, with the changes and the way to the video, and later runs change it. The job needs 'pull-requests: write'."
    default: "true"
  github-token:
    description: "Token for the comment."
    default: ${{ github.token }}

outputs:
  changes:
    description: "Number of visible changes."
    value: ${{ steps.reel.outputs.changes }}
  pages:
    description: "Number of pages with a change."
    value: ${{ steps.reel.outputs.pages }}
  video:
    description: "Path to the video. Empty when nothing changed or video is 'false'."
    value: ${{ steps.reel.outputs.video }}
  report:
    description: "Path to changes.json."
    value: ${{ steps.reel.outputs.report }}
  video-url:
    description: "Address of the artifact with the video. Empty when there is none."
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    # A pull request that is closed only gets its previews taken off their branch
    - name: Drop the previews of the closed pull request
      if: github.event.action == 'closed'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CHANGEREEL_PR: ${{ github.event.pull_request.number }}
      run: node "$GITHUB_ACTION_PATH/src/comment.mjs" --drop
    # The comparison needs Node 22 or newer for its WebSocket. A job that already has it keeps its own.
    - name: Look for Node
      id: node
      if: github.event.action != 'closed'
      shell: bash
      run: |
        major="$(node --version 2>/dev/null | sed 's/^v\([0-9]*\).*/\1/')"
        if [ "${major:-0}" -lt 22 ]; then echo "setup=true" >> "$GITHUB_OUTPUT"; fi
    - uses: actions/setup-node@v7
      if: github.event.action != 'closed' && steps.node.outputs.setup == 'true'
      with:
        node-version: 24
    - name: Install changereel
      if: github.event.action != 'closed'
      shell: bash
      run: npm ci --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
    # The voice runs on the runner: Piper and the voice are fetched once per job
    - name: Install the voice
      if: github.event.action != 'closed' && inputs.narrate != '' && inputs.voice != ''
      shell: bash
      env:
        IN_VOICE: ${{ inputs.voice }}
      run: |
        python3 -m venv "$RUNNER_TEMP/changereel-piper"
        # onnx lets Piper tell when each word is spoken, for the captions
        "$RUNNER_TEMP/changereel-piper/bin/pip" install --quiet piper-tts onnx
        mkdir -p "$RUNNER_TEMP/changereel-voices"
        "$RUNNER_TEMP/changereel-piper/bin/python" -m piper.download_voices --data-dir "$RUNNER_TEMP/changereel-voices" "$IN_VOICE"
    - name: Compare
      id: reel
      if: github.event.action != 'closed'
      shell: bash
      env:
        IN_NARRATE: ${{ inputs.narrate }}
        IN_VOICE: ${{ inputs.voice }}
        IN_LANGUAGE: ${{ inputs.language }}
        IN_PREVIEW: ${{ inputs.preview }}
        IN_PR: ${{ github.event.pull_request.number }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        IN_SERVE: ${{ inputs.serve }}
        IN_BUILD: ${{ inputs.build }}
        IN_BASE: ${{ inputs.base }}
        IN_HEAD: ${{ inputs.head }}
        IN_ROUTES: ${{ inputs.routes }}
        IN_IGNORE: ${{ inputs.ignore }}
        IN_TITLE: ${{ inputs.title }}
        IN_VIDEO: ${{ inputs.video }}
        IN_PASSES: ${{ inputs.passes }}
        IN_MAX_SCENES: ${{ inputs.max-scenes }}
        IN_READY_TIMEOUT: ${{ inputs.ready-timeout }}
      run: |
        if [ -z "$IN_BASE" ]; then
          echo "::error::No base to compare with. Outside a pull request, set the base input."
          exit 2
        fi
        args=(--base "$IN_BASE" --head "$IN_HEAD" --serve "$IN_SERVE" --out "$RUNNER_TEMP/changereel-$GITHUB_ACTION"
              --title "$IN_TITLE" --passes "$IN_PASSES" --max-scenes "$IN_MAX_SCENES" --ready-timeout "$IN_READY_TIMEOUT"
              --language "$IN_LANGUAGE")
        if [ -n "$IN_BUILD" ]; then args+=(--build "$IN_BUILD"); fi
        if [ -n "$IN_ROUTES" ]; then args+=(--routes "$IN_ROUTES"); fi
        if [ -n "$IN_IGNORE" ]; then args+=(--ignore "$IN_IGNORE"); fi
        if [ "$IN_VIDEO" = false ]; then args+=(--no-video); fi
        if [ "$IN_PREVIEW" != false ] && [ -n "$IN_PR" ]; then args+=(--preview); fi
        if [ -n "$IN_NARRATE" ]; then args+=(--narrate --model "$IN_NARRATE"); fi
        if [ -n "$IN_NARRATE" ] && [ -n "$IN_VOICE" ]; then
          args+=(--voice "$RUNNER_TEMP/changereel-voices/$IN_VOICE.onnx" --piper "$RUNNER_TEMP/changereel-piper/bin/piper")
        fi
        node "$GITHUB_ACTION_PATH/src/cli.mjs" "${args[@]}"
    - uses: actions/upload-artifact@v7
      id: upload
      if: github.event.action != 'closed' && inputs.upload != 'false' && steps.reel.outputs.video != ''
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.reel.outputs.video }}
        # The video itself, not a zip with it
        archive: false
    - name: Comment on the pull request
      if: github.event.action != 'closed' && inputs.comment != 'false' && github.event.pull_request.number
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CHANGEREEL_PR: ${{ github.event.pull_request.number }}
        CHANGEREEL_VIDEO_URL: ${{ steps.upload.outputs.artifact-url }}
        CHANGEREEL_PREVIEW: ${{ inputs.preview }}
        CHANGEREEL_SHA: ${{ github.event.pull_request.head.sha }}
        IN_REPORT: ${{ steps.reel.outputs.report }}
      run: node "$GITHUB_ACTION_PATH/src/comment.mjs" "$(dirname "$IN_REPORT")"
